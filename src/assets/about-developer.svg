  <path d="M190 50V274M61 151H319" stroke="#EAE7E3" stroke-width="2"/>

  <!-- person -->
  <path d="M154 120C153 96 170 79 194 80C216 81 228 98 224 121C221 142 208 153 189 155C171 156 157 143 154 120Z" fill="#FFFCF9" stroke="#111111" stroke-width="3"/>
  <path d="M156 112C149 91 162 70 184 67C208 64 225 77 228 97C229 108 224 116 215 120C208 108 197 101 183 102C173 103 164 107 156 112Z" fill="#111111"/>
  <circle cx="205" cy="117" r="8.5" fill="#FFFCF9" stroke="#111111" stroke-width="2.2"/>
  <circle cx="205" cy="117" r="2.6" fill="#111111"/>
  <path d="M197 117L190 115" stroke="#111111" stroke-width="2" stroke-linecap="round"/>

