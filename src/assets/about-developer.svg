  <path d="M101 244C90 235 84 226 87 217C99 219 105 230 104 242" fill="#F47B20" stroke="#111111" stroke-width="1.7"/>
  <path d="M101 242C105 229 116 221 125 220C124 233 115 242 103 247" fill="#FFFCF9" stroke="#111111" stroke-width="1.7"/>

  <!-- baseline -->
  <line x1="62" y1="275" x2="372" y2="275" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>

  <!-- accents -->
  <circle cx="85" cy="172" r="4.5" fill="#F47B20"/>
  <path d="M345 165L351 171M351 165L345 171" stroke="#F47B20" stroke-width="1.8" stroke-linecap="round"/>
