<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none">
  <title>Developer taking a coffee break</title>
  <desc>Minimal black and orange editorial illustration of a developer relaxing with coffee and books.</desc>
  <rect width="440" height="340" fill="#FFFCF9"/>

  <!-- soft window -->
  <path d="M58 274V139C58 83 115 47 190 47C265 47 322 83 322 139V274H58Z" fill="#FFF3E8"/>
