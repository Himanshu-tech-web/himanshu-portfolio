  <path d="M243 205C252 213 258 220 264 229" stroke="#111111" stroke-width="3" stroke-linecap="round"/>

  <!-- coffee cup -->
  <rect x="247" y="210" width="28" height="31" rx="5" fill="#F47B20" stroke="#111111" stroke-width="2.5"/>
  <path d="M275 217C286 216 286 236 275 235" stroke="#111111" stroke-width="2.2"/>
  <path d="M254 200C250 192 257 188 254 181M266 201C262 193 269 188 266 181" stroke="#F47B20" stroke-width="2" stroke-linecap="round"/>

  <!-- books -->
  <rect x="285" y="245" width="75" height="16" rx="2" fill="#FFFCF9" stroke="#111111" stroke-width="2.5"/>
  <rect x="293" y="229" width="67" height="16" rx="2" fill="#F47B20" stroke="#111111" stroke-width="2.5"/>
  <rect x="279" y="213" width="81" height="16" rx="2" fill="#111111"/>
  <line x1="303" y1="237" x2="345" y2="237" stroke="#FFFCF9" stroke-width="1.6"/>

